<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080A09">
  <title>『あなた』をもう一度</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout intro-mode">
    <aside class="sidebar">
      <div class="site-title">『あなた』を<br>もう一度</div>
      <div class="progress" id="progress" aria-label="物語の進行状況">
        <div class="stage active"><span class="stage-number">1</span><span>乳児期</span></div>
        <div class="stage"><span class="stage-number">2</span><span>幼児期</span></div>
        <div class="stage"><span class="stage-number">3</span><span>学童期</span></div>
        <div class="stage"><span class="stage-number">4</span><span>青年期①</span></div>
        <div class="stage"><span class="stage-number">5</span><span>青年期②</span></div>
        <div class="stage"><span class="stage-number">6</span><span>青年期③</span></div>
        <div class="stage"><span class="stage-number">7</span><span>成人初期</span></div>
        <div class="stage"><span class="stage-number">8</span><span>壮年期</span></div>
        <div class="stage"><span class="stage-number">9</span><span>老年期</span></div>
      </div>
      <div class="sidebar-footer">YOUR LIFE, YOUR CHOICES</div>
    </aside>
    <main class="main-content">
      <!-- 導入画面 -->
      <section class="intro screen title-only" id="intro">
        <h1 class="intro-title" id="intro-title">『あなた』をもう一度</h1>
        <div class="intro-art-wrap"><img id="death-god" class="death-god" src="assets/shinigami.png" alt="死神のシルエット"></div>
        <div class="title-line" hidden></div>
        <p class="intro-text" id="intro-line" hidden>この物語はフィクション。</p>
        <button id="start-button" type="button">次へ →</button>
      </section>

      <!-- 質問画面 -->
      <section class="question screen" id="question-screen" hidden>
        <p class="eyebrow" id="eyebrow">01 / 09 乳児期（0〜3歳）</p>
        <h1 id="heading">質問</h1>
        <div class="title-line"></div>
        <div id="story" class="story"></div>
        <p id="question1"></p>
        <div class="choices" id="choices"></div>
      </section>

      <!-- 途絶演出（トランジション）画面：質問終了直後 -->
      <section class="transition-screen screen" id="transition-screen" hidden>
        <div class="title-line"></div>
        
        <!-- 質問直後に選択した履歴一覧を表示 -->
        <div id="choice-history-wrap" class="choice-history-wrap" hidden>
          <h2 class="history-title">【 あなたが歩んだ選択 】</h2>
          <ul id="choice-history-list" class="choice-history-list"></ul>
        </div>

        <div id="transition-text-container" class="step-text-container"></div>

        <button id="transition-next" type="button" class="next-step-button">次へ →</button>
      </section>

      <!-- エンドシーケンス画面 -->
      <section class="ending-sequence-screen screen" id="ending-sequence-screen" hidden>
        <div id="ending-stage" class="ending-stage funeral-bg">
          <div class="ending-content-wrap">
            <div id="death-god-ending-wrap" class="death-god-wrap" hidden>
              <img class="death-god-ending" src="assets/shinigami.png" alt="死神">
            </div>
            
            <div id="ending-text-container" class="step-text-container"></div>

            <!-- 診断風カードUI -->
            <div id="diagnosis-card" class="diagnosis-card" hidden>
              <div class="diag-header">
                <span class="diag-badge">PERSONALITY DIAGNOSIS</span>
                <h2 id="diag-ending-name" class="diag-title"></h2>
              </div>
              <div class="diag-scores-grid">
                <div class="score-bar-item"><span class="score-label">開放性 (O)</span><div class="bar-outer"><div id="bar-O" class="bar-inner"></div></div><span id="val-O" class="score-val"></span></div>
                <div class="score-bar-item"><span class="score-label">誠実性 (C)</span><div class="bar-outer"><div id="bar-C" class="bar-inner"></div></div><span id="val-C" class="score-val"></span></div>
                <div class="score-bar-item"><span class="score-label">外向性 (E)</span><div class="bar-outer"><div id="bar-E" class="bar-inner"></div></div><span id="val-E" class="score-val"></span></div>
                <div class="score-bar-item"><span class="score-label">協調性 (A)</span><div class="bar-outer"><div id="bar-A" class="bar-inner"></div></div><span id="val-A" class="score-val"></span></div>
                <div class="score-bar-item"><span class="score-label">神経症傾向 (N)</span><div class="bar-outer"><div id="bar-N" class="bar-inner"></div></div><span id="val-N" class="score-val"></span></div>
              </div>
              <div class="diag-sins-box">
                <span class="sin-label">象徴する七つの大罪:</span>
                <span id="diag-sins-val" class="sin-val"></span>
              </div>
            </div>

            <button id="ending-next-btn" type="button" class="next-step-button">画面をクリックして進む →</button>
            <button id="ending-back-btn" type="button" class="back-step-button" hidden>思い出す</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="fade-veil" aria-hidden="true"></div>
  <audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
  <audio id="bgm2" src="assets/bgm2.mp3" loop preload="auto"></audio>
  <audio id="bgm3" src="assets/bgm3.mp3" loop preload="auto"></audio>
  <audio id="narration" preload="none"></audio>
  <script src="script.js"></script>
</body>
</html>
